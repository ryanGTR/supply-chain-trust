project:
  type: book
  output-dir: _book

lang: zh-Hant

book:
  title: "供應鏈上的信任"
  subtitle: "一個銀行 IT 工程師的實作紀錄"
  author: "Ryan Chen"
  date: today
  repo-url: https://github.com/ryanGTR/supply-chain-trust
  repo-subdir: book   # 書在 repo 的子目錄，少了這行「看原始碼」會 404
  repo-actions: [source, issue]
  search: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - 01-why-supply-chain.qmd
    - part: "第一部　信任的原語"
      chapters:
        - 02-digital-signature.qmd
        - 03-pki-trust-chain.qmd
        - 04-authenticated-encryption.qmd
        - 05-trust-primitives.qmd
    - part: "第二部　把信任套到產線"
      chapters:
        - 06-ssdf.qmd
        - 07-artifact-signing.qmd
        - 08-key-custody.qmd
    - part: "第三部　進來的東西"
      chapters:
        - 09-what-are-you-trusting.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - theme.scss          # O'Reilly 風：serif 內文 + 紅色強調
    toc: true
    toc-depth: 3
    number-sections: true
    code-tools: true        # 右上角「看原始碼」
    code-line-numbers: true
    code-overflow: scroll
    fig-cap-location: bottom
    callout-appearance: simple
    html-math-method: katex
  pdf:
    documentclass: scrbook  # KOMA-Script，接近書本排版
    papersize: a4
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - inner=3cm
      - outer=2.5cm
    number-sections: true
    colorlinks: true
    code-block-bg: "#f7f7f7"
    # CJK：用 xelatex + Noto CJK（Ryan 機器已有）
    pdf-engine: xelatex
    include-in-header:
      text: |
        \usepackage{fontspec}
        \usepackage{xeCJK}
        \setCJKmainfont{Noto Serif CJK TC}
        \setCJKsansfont{Noto Sans CJK TC}
        \setCJKmonofont{Noto Sans Mono CJK TC}
