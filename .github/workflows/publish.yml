name: Publish book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一份部署；不取消進行中的那份，讓它跑完
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 中文版 → 站台根目錄。只出 HTML：_quarto.yml 也定義了 pdf，
      # 但 PDF 需要 xelatex + Noto CJK，CI 不裝。
      - name: Render 中文版
        run: quarto render --to html
        working-directory: book

      - name: Render English edition
        run: quarto render --to html
        working-directory: book-en

      # 英文版掛在 /en/ 底下
      - name: Assemble site
        run: |
          mkdir -p book/_book/en
          cp -r book-en/_book/. book/_book/en/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
